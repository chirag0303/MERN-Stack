<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
      }
    </style>
  </head>
  <body>
    <h2 id="greetings">Hello</h2>
    <form action="./thankyou.html" onsubmit="handleFormSubmit(event)">
      <input
        type="text"
        name="usernameTemp"
        placeholder="Name"
        onkeyup="handleUserName(event)"
        required
      />
      <input type="email" name="baseEmail" placeholder="Email ID" required />
      <input
        type="password"
        name="abcdPassword"
        placeholder="Password"
        required
      />
      <button>Register</button>
    </form>
    <script src="./form.js"></script>
  </body>
</html>
